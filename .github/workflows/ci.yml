name: CI

on:
  push:
    branches: [ "main", "master", "fix/*" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify and build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            gettext \
            libglib2.0-bin \
            libglib2.0-dev-bin \
            nodejs \
            zip \
            unzip

      - name: Run all verification test suites
        run: make check

      - name: Build the resource bundle
        run: |
          glib-compile-resources \
            --sourcedir=src \
            --target=src/resources.gresource \
            src/resources.gresource.xml

      - name: Compile the translation catalogues
        run: bash po/compile-catalogues.sh

      - name: Build the extension archive
        run: make build

      - name: Check the archive layout
        run: |
          set -e
          top_level="$(zipinfo -1 omnishell@spark.dev.zip | cut -d/ -f1 | sort -u)"
          if [ "$top_level" != "omnishell@spark.dev" ]; then
            echo "Unexpected top-level directory in the archive: $top_level" >&2
            exit 1
          fi
          zipinfo -1 omnishell@spark.dev.zip | grep -q '^omnishell@spark.dev/metadata.json$'
          unzip -tq omnishell@spark.dev.zip

      - name: Upload the extension archive
        uses: actions/upload-artifact@v4
        with:
          name: omnishell-extension
          path: omnishell@spark.dev.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: omnishell@spark.dev.zip
          generate_release_notes: true
